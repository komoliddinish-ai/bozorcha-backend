<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Fursat — bo'lib to'lash</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Ranglar Telegram mavzusidan olinadi (yorug'/qorong'i rejim avtomatik) */
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #F2F3F5);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #FFFFFF));
    --text: var(--tg-theme-text-color, #0F1412);
    --hint: var(--tg-theme-hint-color, #858B88);
    --link: var(--tg-theme-link-color, #0E8A63);
    --sep: rgba(128, 128, 128, 0.16);
    --accent: #0E8A63;
    --accent-2: #13B07F;
    --accent-soft: rgba(14, 138, 99, 0.12);
    --danger: #E5484D;
    --danger-soft: rgba(229, 72, 77, 0.12);
    --warn: #D9822B;
    --warn-soft: rgba(217, 130, 43, 0.14);
    --info: #3E7BFA;
    --info-soft: rgba(62, 123, 250, 0.12);
    --radius: 16px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding-bottom: calc(32px + env(safe-area-inset-bottom));
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  a { color: inherit; text-decoration: none; }
  svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .page { padding: 12px 16px 0; }
  .page.anim { animation: fade .18s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .title { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin: 6px 4px 14px; }
  .section-label { font-size: 13px; color: var(--hint); text-transform: uppercase; letter-spacing: .04em; margin: 22px 4px 8px; }
  .muted { color: var(--hint); }

  /* ---------- Bosh sahifa ---------- */
  .hero {
    position: relative; overflow: hidden;
    border-radius: 22px; padding: 22px 20px 20px; color: #fff;
    background: radial-gradient(120% 140% at 100% 0%, #26C08E 0%, #0E8A63 45%, #0A5E45 100%);
    box-shadow: 0 10px 30px rgba(14, 138, 99, .28);
  }
  .hero::after {
    content: ""; position: absolute; right: -40px; bottom: -60px; width: 200px; height: 200px;
    border-radius: 50%; border: 28px solid rgba(255,255,255,.07);
  }
  .hero .hello { font-size: 14px; opacity: .85; }
  .hero h1 { margin: 4px 0 6px; font-size: 30px; letter-spacing: -0.03em; line-height: 1.05; }
  .hero p { margin: 0 0 18px; font-size: 15px; opacity: .92; max-width: 260px; }
  .hero .facts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .hero .fact { background: rgba(255,255,255,.16); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 500; }
  .hero .cta {
    display: inline-flex; align-items: center; gap: 6px;
    background: #fff; color: #0A5E45; font-weight: 600; padding: 11px 18px; border-radius: 12px;
  }

  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .step { background: var(--card); border-radius: 14px; padding: 12px 10px; box-shadow: var(--shadow); }
  .step b { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-size: 13px; margin-bottom: 8px; }
  .step span { font-size: 13px; line-height: 1.3; display: block; }

  /* iOS uslubidagi ro'yxat */
  .list { background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; text-align: left; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 58px; right: 0; height: 1px; background: var(--sep); }
  .row:active { background: var(--sep); }
  .row .ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: none; }
  .row .ic svg { width: 18px; height: 18px; }
  .row .grow { flex: 1; min-width: 0; }
  .row .t { font-weight: 500; }
  .row .s { font-size: 13px; color: var(--hint); margin-top: 1px; }
  .row .chev { color: var(--hint); opacity: .6; }
  .row .badge { background: var(--danger); color: #fff; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 8px; }

  /* ---------- Katalog ---------- */
  .segment { display: grid; grid-template-columns: 1fr 1fr; background: var(--sep); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
  .segment button { padding: 8px; border-radius: 9px; font-weight: 500; font-size: 14px; color: var(--hint); transition: background .15s; }
  .segment button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  .search { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 12px; padding: 0 12px; margin-bottom: 12px; color: var(--hint); }
  .search input { flex: 1; border: 0; outline: 0; background: none; padding: 11px 0; color: var(--text); font-size: 15px; }

  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 14px; padding: 0 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 7px 14px; border-radius: 999px; background: var(--card); font-size: 14px; font-weight: 500; box-shadow: var(--shadow); }
  .chip.on { background: var(--text); color: var(--card); }
  .chip .n { opacity: .5; margin-left: 4px; font-weight: 400; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card { background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); text-align: left; display: flex; flex-direction: column; transition: transform .12s; }
  .card:active { transform: scale(.97); }
  .card .img { aspect-ratio: 1 / 0.92; background: #E8F0EC; position: relative; }
  .card .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .tag { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 6px; backdrop-filter: blur(6px); }
  .card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .card .name { font-weight: 600; font-size: 14px; line-height: 1.25; }
  .card .meta { font-size: 12px; color: var(--hint); }
  .card .price { font-weight: 700; font-size: 15px; margin-top: auto; padding-top: 6px; letter-spacing: -0.01em; }
  .card .monthly { display: inline-block; align-self: flex-start; font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 6px; }

  .vlist { display: flex; flex-direction: column; gap: 10px; }
  .vrow { display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: var(--radius); padding: 10px; box-shadow: var(--shadow); text-align: left; width: 100%; }
  .vrow:active { transform: scale(.98); }
  .vrow img { width: 72px; height: 72px; border-radius: 12px; object-fit: cover; flex: none; }
  .vrow .grow { flex: 1; min-width: 0; }
  .vrow .name { font-weight: 600; }
  .vrow .meta { font-size: 13px; color: var(--hint); margin: 2px 0 6px; }
  .vrow .price { font-weight: 700; }
  .vrow .monthly { font-size: 13px; color: var(--accent); font-weight: 600; }

  /* ---------- Holatlar ---------- */
  .empty { text-align: center; padding: 56px 24px; color: var(--hint); }
  .empty .em { font-size: 44px; margin-bottom: 10px; }
  .empty .et { color: var(--text); font-weight: 600; font-size: 17px; margin-bottom: 4px; }
  .empty .btn { margin-top: 18px; }
  .skel { background: linear-gradient(90deg, var(--sep) 0%, rgba(128,128,128,.08) 50%, var(--sep) 100%); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: var(--radius); }
  @keyframes sh { to { background-position: -200% 0; } }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 18px; border-radius: 12px; font-weight: 600; background: var(--accent); color: #fff; }
  .btn.block { width: 100%; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.soft { background: var(--sep); color: var(--text); }
  .btn.danger { background: var(--danger-soft); color: var(--danger); }
  .btn.sm { padding: 8px 12px; font-size: 14px; border-radius: 10px; }
  .btn:disabled { opacity: .5; }

  /* ---------- Pastki panel (sheet) ---------- */
  .sheet { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
  .sheet .shade { position: absolute; inset: 0; background: rgba(0,0,0,.42); opacity: 0; transition: opacity .22s; }
  .sheet .panel {
    position: absolute; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain;
    background: var(--bg); border-radius: 22px 22px 0 0;
    padding: 8px 16px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.open { pointer-events: auto; }
  .sheet.open .shade { opacity: 1; }
  .sheet.open .panel { transform: none; }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--sep); margin: 0 auto 10px; }
  .sheet-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .sheet-head .grow { flex: 1; }
  .sheet-head h2 { margin: 0; font-size: 21px; letter-spacing: -0.02em; line-height: 1.2; }
  .close { width: 30px; height: 30px; border-radius: 50%; background: var(--sep); display: grid; place-items: center; color: var(--hint); flex: none; }
  .close svg { width: 16px; height: 16px; }

  .pimg { width: 100%; height: 220px; object-fit: contain; background: linear-gradient(135deg, #EEF4F1, #DCE8E2); border-radius: var(--radius); display: block; margin-bottom: 14px; }
  .box { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .box-label { font-size: 13px; color: var(--hint); margin-bottom: 8px; display: flex; justify-content: space-between; }
  .box-label b { color: var(--text); font-weight: 600; }
  .kv { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; padding: 4px 0; }
  .kv span:first-child { color: var(--hint); }
  .kv span:last-child { font-weight: 500; text-align: right; }

  .terms { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .term { padding: 10px 0; border-radius: 11px; background: var(--bg); font-weight: 600; font-size: 15px; text-align: center; transition: background .12s; }
  .term small { display: block; font-size: 11px; font-weight: 500; color: var(--hint); }
  .term.on { background: var(--accent); color: #fff; }
  .term.on small { color: rgba(255,255,255,.8); }

  input[type=range] { width: 100%; accent-color: var(--accent); margin: 6px 0 2px; }
  .range-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--hint); }

  .summary { background: linear-gradient(135deg, #0E8A63, #0A6B4D); color: #fff; border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .summary .lbl { font-size: 13px; opacity: .8; }
  .summary .big { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; margin: 2px 0 10px; }
  .summary .big small { font-size: 15px; font-weight: 500; opacity: .8; }
  .summary .kv span:first-child { color: rgba(255,255,255,.75); }
  .summary .kv { border-top: 1px solid rgba(255,255,255,.14); padding: 7px 0 0; margin-top: 7px; }

  .field { display: block; margin-bottom: 10px; }
  .field > span { display: block; font-size: 13px; color: var(--hint); margin: 0 4px 6px; }
  .input { display: flex; align-items: center; background: var(--card); border-radius: 12px; border: 1.5px solid transparent; transition: border-color .15s; box-shadow: var(--shadow); }
  .input:focus-within { border-color: var(--accent); }
  .input .pre { padding-left: 13px; color: var(--hint); font-weight: 500; }
  .input input, .input select, .input textarea { flex: 1; width: 100%; min-width: 0; border: 0; outline: 0; background: none; padding: 13px; font-size: 16px; }
  .input textarea { resize: vertical; min-height: 70px; }
  .input.err { border-color: var(--danger); }
  .hint-err { color: var(--danger); font-size: 13px; margin: -4px 4px 10px; }
  .note { font-size: 12px; color: var(--hint); text-align: center; margin-top: 10px; line-height: 1.4; }

  .success { text-align: center; padding: 24px 8px 8px; }
  .success .ok { width: 76px; height: 76px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin: 0 auto 16px; animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
  .success .ok svg { width: 38px; height: 38px; stroke-width: 2.6; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  .success h2 { margin: 0 0 6px; font-size: 22px; }
  .success p { margin: 0 0 20px; color: var(--hint); }

  /* ---------- To'lovlarim ---------- */
  .pay { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .pay .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .pay .pname { font-weight: 600; }
  .pay .pdate { font-size: 12px; color: var(--hint); margin-top: 2px; }
  .pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .pill.new { background: var(--info-soft); color: var(--info); }
  .pill.contacted { background: var(--warn-soft); color: var(--warn); }
  .pill.approved { background: var(--accent-soft); color: var(--accent); }
  .pill.rejected { background: var(--danger-soft); color: var(--danger); }
  .bar { height: 8px; border-radius: 4px; background: var(--sep); overflow: hidden; margin: 12px 0 6px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 4px; transition: width .4s; }
  .pay .foot { display: flex; justify-content: space-between; font-size: 13px; color: var(--hint); }
  .pay .foot b { color: var(--text); font-weight: 600; }
  .pay .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
  .pay .stat { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
  .pay .stat span { display: block; font-size: 11px; color: var(--hint); }
  .pay .stat b { font-size: 13px; }

  /* ---------- Filiallar ---------- */
  .branch { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .branch .bn { font-weight: 600; font-size: 16px; }
  .branch .ba { color: var(--hint); font-size: 14px; margin: 2px 0 12px; display: flex; gap: 6px; align-items: center; }
  .branch .ba svg { width: 15px; height: 15px; }
  .branch .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* ---------- Admin ---------- */
  .adm { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .adm .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .adm .id { font-weight: 700; }
  .adm .who { font-weight: 600; font-size: 16px; }
  .adm .tel { color: var(--link); font-weight: 500; display: inline-flex; align-items: center; gap: 5px; margin: 2px 0 8px; }
  .adm .tel svg { width: 15px; height: 15px; }
  .adm .prod { font-size: 14px; background: var(--bg); border-radius: 10px; padding: 9px 11px; margin-bottom: 10px; }
  .adm .prod .muted { font-size: 13px; }
  .adm .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .adm .acts .btn { flex: 1; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 36px; height: 36px; border-radius: 10px; background: var(--sep); display: grid; place-items: center; }
  .stepper b { min-width: 48px; text-align: center; }

  .prow { display: flex; align-items: center; gap: 12px; padding: 10px 14px; width: 100%; text-align: left; position: relative; }
  .prow + .prow::before { content: ""; position: absolute; top: 0; left: 66px; right: 0; height: 1px; background: var(--sep); }
  .prow img { width: 40px; height: 40px; border-radius: 9px; object-fit: cover; flex: none; }
  .prow .grow { flex: 1; min-width: 0; }
  .prow .t { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prow .s { font-size: 13px; color: var(--hint); }
  .prow.off { opacity: .45; }

  .switch { display: flex; align-items: center; justify-content: space-between; background: var(--card); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .switch input { width: 46px; height: 28px; appearance: none; background: var(--sep); border-radius: 14px; position: relative; transition: background .2s; cursor: pointer; margin: 0; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
  .switch input:checked { background: var(--accent); }
  .switch input:checked::after { transform: translateX(18px); }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: rgba(20,20,20,.9); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: .2s; z-index: 100; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<div id="app"></div>

<div class="sheet" id="sheet">
  <div class="shade" data-close-sheet></div>
  <div class="panel" id="sheetPanel"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
const inTelegram = !!tg?.initData;
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); } catch (e) {}
}

// Mini app shu backend'ning o'zidan ochilsa — nisbiy manzil, aks holda Railway manzili
const SAME_ORIGIN = /(^localhost$|^127\.0\.0\.1$|\.up\.railway\.app$)/.test(location.hostname);
const API_BASE = SAME_ORIGIN ? '' : 'https://bozorcha-backend-production.up.railway.app';
const MIN_DOWN_PAYMENT_RATE = 0.30; // boshlang'ich to'lov kamida naqd narxining 30%i

// ---------- Yordamchi funksiyalar ----------

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// Narxlar AQSh dollarida: 1540 -> "1 540 $", 103.333 -> "103.33 $"
const round2 = (x) => Math.round(x * 100) / 100;
function money(v) {
  const [int, dec] = round2(Number(v)).toFixed(2).split('.');
  return int.replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0') + (dec === '00' ? '' : '.' + dec) + '\u00A0$';
}
// Qisqa ko'rinish (kartochkalar uchun) — butun dollargacha
const shortMoney = (v) => money(Math.round(v));
function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s.replace(' ', 'T') + 'Z');
  const m = ['yan', 'fev', 'mar', 'apr', 'may', 'iyn', 'iyl', 'avg', 'sen', 'okt', 'noy', 'dek'];
  return `${d.getDate()} ${m[d.getMonth()]}, ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function haptic(type = 'light') {
  try {
    if (['success', 'error', 'warning'].includes(type)) tg?.HapticFeedback?.notificationOccurred(type);
    else if (type === 'select') tg?.HapticFeedback?.selectionChanged();
    else tg?.HapticFeedback?.impactOccurred(type);
  } catch (e) {}
}
function toast(text) {
  const el = $('#toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove('show'), 2200);
}
function alertMsg(text) {
  if (tg?.showAlert && inTelegram) tg.showAlert(text); else alert(text);
}
function openLink(url) {
  if (tg?.openLink && inTelegram) tg.openLink(url); else window.open(url, '_blank');
}

const ICONS = {
  phone: '<rect x="5" y="2" width="14" height="20" rx="3"/><path d="M11 18h2"/>',
  card: '<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/>',
  call: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
  pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  store: '<path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"/>',

// ---------- Telefon rasmlari ----------
// Haqiqiy foto bo'lmasa (admin rasm havolasini kiritmagan bo'lsa), telefonning
// brendi, modeli va rangiga qarab chiroyli illyustratsiya chiziladi.

const PHONE_COLORS = [
  [/kumush|silver|oq\b|white/i, '#E2E3E6'],
  [/qora|black/i, '#2B2B2E'],
  [/ko'k|blue/i, '#3D5A80'],
  [/titan|natural/i, '#BDB3A4'],
  [/yashil|green/i, '#5E7F6E'],
  [/sariq|orange/i, '#D9773A'],
  [/pushti|pink/i, '#E6BFC8'],
  [/binafsha|purple|lavender/i, '#8E7CB0'],
];
const DEFAULT_COLORS = ['#3D5A80', '#BDB3A4', '#2B2B2E', '#5E7F6E', '#8E7CB0', '#E2E3E6'];

function phoneColor(p) {
  const text = `${p.name} ${p.description || ''}`;
  for (const [re, c] of PHONE_COLORS) if (re.test(text)) return c;
  let h = 0;
  for (const ch of p.model_group || p.name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return DEFAULT_COLORS[h % DEFAULT_COLORS.length];
}

// a va b ranglarni t nisbatda aralashtiradi
function mix(a, b, t) {
  const pa = a.match(/\w\w/g).map(x => parseInt(x, 16));
  const pb = b.match(/\w\w/g).map(x => parseInt(x, 16));
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const isLight = (hex) => {
  const [r, g, b] = hex.match(/\w\w/g).map(x => parseInt(x, 16));
  return r * 0.299 + g * 0.587 + b * 0.114 > 150;
};

function cameraKind(p) {
  const n = (p.model_group || p.name).toLowerCase();
  if (n.includes('iphone')) {
    if (!n.includes('pro')) return 'iphone-duo';
    return /iphone 1[7-9]|iphone 2/.test(n) ? 'iphone-plateau' : 'iphone-pro';
  }
  if (n.includes('galaxy') || n.includes('samsung')) return n.includes('ultra') ? 'samsung-ultra' : 'samsung';
  if (n.includes('redmi') || n.includes('poco')) return 'redmi';
  return 'xiaomi';
}

function lens(cx, cy, r, ring) {
  return `<circle cx='${cx}' cy='${cy}' r='${r + 2.4}' fill='${ring}'/>
    <circle cx='${cx}' cy='${cy}' r='${r}' fill='#0A0A0C'/>
    <circle cx='${cx}' cy='${cy}' r='${r * 0.58}' fill='url(#lens)'/>
    <circle cx='${cx - r * 0.32}' cy='${cy - r * 0.32}' r='${r * 0.2}' fill='#fff' opacity='.55'/>`;
}
const flash = (cx, cy, r = 3) => `<circle cx='${cx}' cy='${cy}' r='${r}' fill='#F3EEDC'/><circle cx='${cx}' cy='${cy}' r='${r * 0.5}' fill='#E2D9B8'/>`;

function cameras(kind, x, y, W, body) {
  const mod = mix(body, isLight(body) ? '#FFFFFF' : '#FFFFFF', 0.1);
  const modStroke = mix(body, '#000000', 0.18);
  const ring = mix(body, '#000000', 0.45);
  switch (kind) {
    case 'iphone-plateau':
      return `<rect x='${x + 5}' y='${y + 7}' width='${W - 10}' height='52' rx='15' fill='${mod}' stroke='${modStroke}' stroke-width='.8'/>
        ${lens(x + 21, y + 21, 8.5, ring)}${lens(x + 21, y + 45, 8.5, ring)}${lens(x + 42, y + 33, 8.5, ring)}
        ${flash(x + W - 20, y + 22)}<circle cx='${x + W - 20}' cy='${y + 44}' r='3' fill='#1A1A1C'/>`;
    case 'iphone-pro':
      return `<rect x='${x + 7}' y='${y + 7}' width='50' height='50' rx='14' fill='${mod}' stroke='${modStroke}' stroke-width='.8'/>
        ${lens(x + 20, y + 20, 8.5, ring)}${lens(x + 20, y + 44, 8.5, ring)}${lens(x + 43, y + 32, 8.5, ring)}
        ${flash(x + 43, y + 15, 2.8)}<circle cx='${x + 43}' cy='${y + 49}' r='2.8' fill='#1A1A1C'/>`;
    case 'iphone-duo':
      return `<rect x='${x + 8}' y='${y + 8}' width='28' height='52' rx='14' fill='${mod}' stroke='${modStroke}' stroke-width='.8'/>
        ${lens(x + 22, y + 22, 8.5, ring)}${lens(x + 22, y + 46, 8.5, ring)}${flash(x + 44, y + 22, 2.8)}`;
    case 'samsung-ultra':
      return `${lens(x + 22, y + 20, 8, ring)}${lens(x + 22, y + 41, 8, ring)}${lens(x + 22, y + 62, 8, ring)}
        ${lens(x + 42, y + 30, 6, ring)}${lens(x + 42, y + 52, 6, ring)}${flash(x + 42, y + 14, 2.4)}`;
    case 'samsung':
      return `${lens(x + 22, y + 20, 8, ring)}${lens(x + 22, y + 41, 8, ring)}${lens(x + 22, y + 62, 8, ring)}${flash(x + 38, y + 20, 2.4)}`;
    case 'redmi':
      return `<rect x='${x + 8}' y='${y + 8}' width='34' height='64' rx='11' fill='${mod}' stroke='${modStroke}' stroke-width='.8'/>
        ${lens(x + 25, y + 25, 10, ring)}${lens(x + 25, y + 53, 7, ring)}${flash(x + 50, y + 18, 2.6)}`;
    default:
      return `<rect x='${x + 7}' y='${y + 7}' width='54' height='54' rx='13' fill='${mod}' stroke='${modStroke}' stroke-width='.8'/>
        ${lens(x + 21, y + 21, 9, ring)}${lens(x + 47, y + 21, 9, ring)}${lens(x + 21, y + 47, 9, ring)}${flash(x + 47, y + 47, 3)}`;
  }
}

const artCache = new Map();
function phoneArt(p) {
  const body = phoneColor(p);
  const kind = cameraKind(p);
  const key = body + kind;
  if (artCache.has(key)) return artCache.get(key);

  const light = isLight(body);
  const isIphone = kind.startsWith('iphone');
  const bg1 = mix(body, '#F6F8F7', light ? 0.55 : 0.86);
  const bg2 = mix(body, '#DDE5E1', light ? 0.45 : 0.72);
  const wallA = mix(body, '#7B9CFF', 0.55);
  const wallB = mix(body, '#0C0E1A', 0.8);
  const edge = light ? 'rgba(0,0,0,.10)' : 'rgba(255,255,255,.28)';

  // Orqadagi telefon — old tomoni (ekran)
  const fx = 108, fy = 34, fW = 86, fH = 176;
  // Oldindagi telefon — orqa tomoni (kamera)
  const bx = 44, by = 26, bW = 92, bH = 188;

  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 240'>
  <defs>
    <radialGradient id='bg' cx='.5' cy='.35' r='.8'><stop offset='0' stop-color='${bg1}'/><stop offset='1' stop-color='${bg2}'/></radialGradient>
    <linearGradient id='sheen' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0' stop-color='#fff' stop-opacity='${light ? 0.5 : 0.22}'/>
      <stop offset='.45' stop-color='#fff' stop-opacity='0'/>
      <stop offset='1' stop-color='#000' stop-opacity='${light ? 0.12 : 0.28}'/>
    </linearGradient>
    <linearGradient id='wall' x1='0' y1='0' x2='.6' y2='1'><stop offset='0' stop-color='${wallA}'/><stop offset='1' stop-color='${wallB}'/></linearGradient>
    <radialGradient id='lens' cx='.4' cy='.4' r='.7'><stop offset='0' stop-color='#4A5D8A'/><stop offset='1' stop-color='#0A0A0C'/></radialGradient>
    <filter id='sh' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='5'/></filter>
  </defs>
  <rect width='240' height='240' fill='url(#bg)'/>
  <ellipse cx='124' cy='222' rx='78' ry='7' fill='#000' opacity='.22' filter='url(#sh)'/>

  <g transform='rotate(7 ${fx + fW / 2} ${fy + fH / 2})'>
    <rect x='${fx}' y='${fy}' width='${fW}' height='${fH}' rx='20' fill='${mix(body, '#000000', 0.15)}'/>
    <rect x='${fx + 3.5}' y='${fy + 3.5}' width='${fW - 7}' height='${fH - 7}' rx='17' fill='url(#wall)'/>
    <circle cx='${fx + 20}' cy='${fy + 120}' r='38' fill='${wallA}' opacity='.35'/>
    <circle cx='${fx + 70}' cy='${fy + 60}' r='26' fill='#fff' opacity='.08'/>
    ${isIphone
      ? `<rect x='${fx + fW / 2 - 13}' y='${fy + 9}' width='26' height='8' rx='4' fill='#050505'/>`
      : `<circle cx='${fx + fW / 2}' cy='${fy + 13}' r='3.4' fill='#050505'/>`}
    <text x='${fx + fW / 2}' y='${fy + 50}' text-anchor='middle' font-family='-apple-system,Helvetica,Arial' font-size='20' font-weight='600' fill='#fff' opacity='.92'>9:41</text>
  </g>

  <g transform='rotate(-6 ${bx + bW / 2} ${by + bH / 2})'>
    <rect x='${bx - 1.6}' y='${by + 52}' width='3' height='22' rx='1.5' fill='${mix(body, '#000000', 0.3)}'/>
    <rect x='${bx}' y='${by}' width='${bW}' height='${bH}' rx='21' fill='${body}'/>
    <rect x='${bx}' y='${by}' width='${bW}' height='${bH}' rx='21' fill='url(#sheen)'/>
    <rect x='${bx + 0.8}' y='${by + 0.8}' width='${bW - 1.6}' height='${bH - 1.6}' rx='20.2' fill='none' stroke='${edge}' stroke-width='1.2'/>
    ${cameras(kind, bx, by, bW, body)}
  </g>
</svg>`;
  const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.replace(/\s+/g, ' '));
  artCache.set(key, url);
  return url;
}

// Admin haqiqiy foto havolasini kiritgan bo'lsa — o'sha, aks holda illyustratsiya.
// (Eski bazadagi avtomatik SVG rasmlar e'tiborga olinmaydi.)
const imgOf = (p) => (p.image_url && /^https?:\/\//.test(p.image_url)) ? p.image_url : phoneArt(p);

// ---------- API ----------

function authHeaders() {
  return tg?.initData ? { 'Authorization': 'tma ' + tg.initData } : {};
}
async function api(path, opts = {}) {
  let res;
  try {
    res = await fetch(API_BASE + path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', ...authHeaders(), ...(opts.headers || {}) },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
  } catch (e) {
    throw new Error("Internet bilan aloqa yo'q. Qayta urinib ko'ring.");
  }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error(data?.error || `Xatolik (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return data;
}

// ---------- Bo'lib to'lash hisob-kitobi (server bilan bir xil formula) ----------

function calcPlan(basePrice, months, downPayment) {
  const term = state.terms.find(t => t.months === months);
  if (!term) return null;
  const dp = downPayment ?? round2(basePrice * MIN_DOWN_PAYMENT_RATE);
  const remaining = basePrice - dp;
  const remainingWithMarkup = round2(remaining * (1 + term.markup));
  return {
    months, markup: term.markup, downPayment: dp,
    total: round2(remainingWithMarkup + dp),
    monthly: round2(remainingWithMarkup / months),
    overpay: round2(remainingWithMarkup - remaining),
  };
}
const longestTerm = () => state.terms.length ? Math.max(...state.terms.map(t => t.months)) : null;
function fromMonthly(price) {
  const m = longestTerm();
  return m ? calcPlan(price, m).monthly : null;
}

// ---------- Navigatsiya ----------

function go(screen) {
  haptic('light');
  if (screen === 'admin') { state.admin.apps = null; state.admin.products = null; } // har kirganda yangilansin
  stack.push(screen);
  render(true);
  window.scrollTo(0, 0);
}
function goBack() {
  if ($('#sheet').classList.contains('open')) { closeSheet(); return; }
  if (stack.length > 1) stack.pop();
  render(true);
}
tg?.BackButton.onClick(goBack);

function render(animate = false) {
  const screen = stack[stack.length - 1];
  if (tg) {
    if (screen === 'home') tg.BackButton.hide(); else tg.BackButton.show();
  }
  const views = { home, catalog, model: modelView, payments, callcenter, branches, admin: adminView };
  $('#app').innerHTML = `<div class="page${animate ? ' anim' : ''}">${(views[screen] || home)()}</div>`;
  bind();
  updateMainButton();
}

// Barcha bosiladigan elementlar data-* atributlar orqali ishlaydi
function bind() {
  $$('[data-go]').forEach(el => el.onclick = () => go(el.dataset.go));
  $$('[data-cond]').forEach(el => el.onclick = () => { haptic('select'); state.condition = el.dataset.cond; state.brand = 'all'; render(); });
  $$('[data-brand]').forEach(el => el.onclick = () => { haptic('select'); state.brand = el.dataset.brand; render(); });
  $$('[data-model]').forEach(el => el.onclick = () => {
    const items = modelItems(el.dataset.model);
    if (items.length === 1) openProduct(items[0].id);
    else { state.model = el.dataset.model; go('model'); }
  });
  $$('[data-product]').forEach(el => el.onclick = () => openProduct(Number(el.dataset.product)));
  $$('[data-retry]').forEach(el => el.onclick = () => { el.disabled = true; init(); });
  $$('[data-map]').forEach(el => el.onclick = () => openLink('https://yandex.uz/maps/?text=' + encodeURIComponent(el.dataset.map)));

  const search = $('#search');
  if (search) {
    search.oninput = () => {
      state.query = search.value;
      $('#catalogResults').innerHTML = catalogResults();
      bind();
    };
  }
  if (stack[stack.length - 1] === 'admin') bindAdmin();
}

function catalog() {
  const byCond = state.products.filter(p => p.condition === state.condition);

  return `
    <div class="title">Telefonlar</div>
    <div class="segment">
      <button class="${state.condition === 'new' ? 'on' : ''}" data-cond="new">Yangi</button>

      <button class="chip ${state.brand === 'all' ? 'on' : ''}" data-brand="all">Barchasi</button>

        <button class="chip ${String(state.brand) === String(c.id) ? 'on' : ''}" data-brand="${c.id}">${esc(c.name)}<span class="n">${c.n}</span></button>
      `).join('')}
    </div>
    <div id="catalogResults">${catalogResults()}</div>
  `;

function filteredProducts() {
  const q = state.query.trim().toLowerCase();
  return state.products.filter(p =>
    p.condition === state.condition &&
    (state.brand === 'all' || String(p.category_id) === String(state.brand)) &&
    (!q || p.name.toLowerCase().includes(q) || p.model_group.toLowerCase().includes(q))
  );
}
function groupByModel(list) {
  const map = new Map();
  for (const p of list) {
    if (!map.has(p.model_group)) map.set(p.model_group, []);
    map.get(p.model_group).push(p);
  }
  return [...map.entries()].map(([name, items]) => ({ name, items, min: Math.min(...items.map(i => i.price)) }));
}
function modelItems(name) {
  return state.products.filter(p => p.model_group === name && p.condition === state.condition).sort((a, b) => a.price - b.price);
}

function catalogResults() {
  if (!state.products.length) return skeletonGrid();
  const groups = groupByModel(filteredProducts());
  if (!groups.length) {
    return `<div class="empty"><div class="em">🔍</div><div class="et">Hech narsa topilmadi</div>Boshqa brend yoki so'zni sinab ko'ring</div>`;
  }
  return `<div class="grid">${groups.map(g => {
    const cheapest = g.items.reduce((a, b) => a.price <= b.price ? a : b);
    const m = fromMonthly(g.min);
    return `
      <button class="card" data-model="${esc(g.name)}">
        <div class="img"><img src="${esc(imgOf(cheapest))}" alt="" loading="lazy">${state.condition === 'used' ? '<span class="tag">B/U</span>' : ''}</div>

          <div class="name">${esc(g.name)}</div>

          ${m ? `<span class="monthly">oyiga ${shortMoney(m)} dan</span>` : ''}
        </div>
      </button>`;
  }).join('')}</div>`;
}
function skeletonGrid() {
  return `<div class="grid">${'<div class="skel" style="height:250px"></div>'.repeat(4)}</div>`;
}

async function loadInfo() {

const sheet = { mode: null, product: null, term: null, dpPct: 30, name: '', phone: '', errors: {}, sending: false, result: null, edit: null };

function openSheet() {
  $('#sheet').classList.add('open');
  document.body.style.overflow = 'hidden';
  tg?.BackButton.show();
}
function closeSheet() {
  $('#sheet').classList.remove('open');
  document.body.style.overflow = '';
  sheet.mode = null;
  if (stack.length === 1) tg?.BackButton.hide();
  updateMainButton();
}
$$('[data-close-sheet]').forEach(el => el.onclick = closeSheet);

function openProduct(id) {
  haptic('light');
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  Object.assign(sheet, {
    mode: 'product', product: p, term: longestTerm() >= 6 ? 6 : longestTerm(), dpPct: 30,
    name: sheet.name || tg?.initDataUnsafe?.user?.first_name || '',
    errors: {}, sending: false, result: null,
  });
  renderSheet();
  openSheet();
  $('#sheetPanel').scrollTop = 0;
}

function currentPlan() {
  const p = sheet.product;
  const dp = Math.max(round2(p.price * MIN_DOWN_PAYMENT_RATE), round2(p.price * sheet.dpPct / 100));
  return calcPlan(p.price, sheet.term, dp);
}

function renderSheet() {
  const panel = $('#sheetPanel');
  if (sheet.mode === 'product') panel.innerHTML = sheet.result ? successHTML() : productHTML();
  else if (sheet.mode === 'edit') panel.innerHTML = editProductHTML();
  bindSheet();
  updateMainButton();
}

function bindSheet() {
  const panel = $('#sheetPanel');
  $$('[data-close-sheet]', panel).forEach(el => el.onclick = closeSheet);

  if (sheet.mode === 'product' && !sheet.result) {
    $$('[data-term]', panel).forEach(el => el.onclick = () => { haptic('select'); sheet.term = Number(el.dataset.term); renderSheet(); });
    const dp = $('#dp');
    dp.oninput = () => {
      sheet.dpPct = Number(dp.value);
      const plan = currentPlan();
      $('#dpVal').textContent = `${money(plan.downPayment)} · ${sheet.dpPct}%`;
      $('#summary').innerHTML = summaryHTML(plan);
      const btn = $('#submitBtn');
      if (btn) btn.textContent = `Ariza yuborish · ${money(plan.monthly)}/oy`;
      updateMainButton();
    };
    dp.onchange = () => haptic('select');
    $('#custName').oninput = (e) => { sheet.name = e.target.value; };
    const phone = $('#custPhone');
    phone.oninput = () => {
      let d = phone.value.replace(/\D/g, '');
      if (d.length > 9 && d.startsWith('998')) d = d.slice(3);
      d = d.slice(0, 9);
      phone.value = [d.slice(0, 2), d.slice(2, 5), d.slice(5, 7), d.slice(7, 9)].filter(Boolean).join(' ');
      sheet.phone = phone.value;
    };
    const btn = $('#submitBtn');
    if (btn) btn.onclick = submitApplication;
  }
  if (sheet.mode === 'product' && sheet.result) {
    $('#toPayments').onclick = () => { closeSheet(); stack = ['home', 'payments']; render(); };
  }
  if (sheet.mode === 'edit') bindEditProduct();
}

async function submitApplication() {
  if (sheet.sending) return;
  const digits = sheet.phone.replace(/\D/g, '');
  sheet.errors = {};
  if (!sheet.name.trim()) sheet.errors.name = 'Ismingizni kiriting';
  if (digits.length !== 9) sheet.errors.phone = "Raqamni to'liq kiriting: 90 123 45 67";
  if (Object.keys(sheet.errors).length) {
    haptic('error');
    renderSheet();
    $('#sheetPanel').scrollTo({ top: $('#sheetPanel').scrollHeight, behavior: 'smooth' });
    return;
  }
  const plan = currentPlan();
  sheet.sending = true;
  renderSheet();
  try {
    sheet.result = await api('/api/applications', {
      method: 'POST',
      body: {
        product_id: sheet.product.id,
        term_months: plan.months,
        down_payment: plan.downPayment,
        customer_name: sheet.name.trim(),
        customer_phone: '998' + digits,
      },
    });
    sheet.phoneFormatted = '+998 ' + sheet.phone;
    state.applications = null; // "To'lovlarim" qayta yuklansin
    if (state.me?.is_admin) loadAdminApps();
    haptic('success');
  } catch (e) {
    haptic('error');
    alertMsg(e.status === 401 ? "Ilovani Telegram bot orqali oching, so'ng qayta urinib ko'ring." : e.message);
  }
  sheet.sending = false;
  renderSheet();
  $('#sheetPanel').scrollTop = 0;
}

// Telegram'ning pastki katta tugmasi
let mainAction = null;
function updateMainButton() {
  if (!tg?.MainButton || !inTelegram) return;
  const mb = tg.MainButton;
  const open = $('#sheet').classList.contains('open');
  mainAction = null;
  if (open && sheet.mode === 'product' && !sheet.result) {
    const plan = currentPlan();
    mainAction = submitApplication;
    mb.setParams({ text: sheet.sending ? 'Yuborilmoqda…' : `Ariza yuborish · ${money(plan.monthly)}/oy`, color: '#0E8A63', text_color: '#ffffff', is_active: !sheet.sending, is_visible: true });
    if (sheet.sending) mb.showProgress(); else mb.hideProgress();
  } else if (open && sheet.mode === 'edit') {
    mainAction = saveProduct;
    mb.setParams({ text: sheet.edit?.id ? 'Saqlash' : "Mahsulotni qo'shish", color: '#0E8A63', text_color: '#ffffff', is_active: true, is_visible: true });
    mb.hideProgress();
  } else {
    mb.hide();
  }
}
tg?.MainButton.onClick(() => mainAction && mainAction());

async function loadAdminProducts() {
  try { state.admin.products = await api('/api/admin/products'); }
  catch (e) { state.admin.products = { error: e.message }; }

async function updateApp(id, body) {
  try {
    const row = await api(`/api/admin/applications/${id}`, { method: 'PATCH', body });

    state.admin.newCount = state.admin.apps.filter(x => x.status === 'new').length;
    haptic(body.status ? 'success' : 'light');

    <div class="switch"><span>Katalogda ko'rinsin</span><input type="checkbox" id="eActive" ${e.is_active ? 'checked' : ''}></div>
    ${sheet.errors.form ? `<div class="hint-err" style="margin:4px">${esc(sheet.errors.form)}</div>` : ''}
    ${inTelegram ? '' : `<button class="btn block" id="saveBtn">${e.id ? 'Saqlash' : "Qo'shish"}</button>`}
  `;
}
function bindEditProduct() {
  const price = $('#ePrice');
  price.oninput = () => { price.value = price.value.replace(/[^\d.,]/g, ''); };
  const btn = $('#saveBtn');
  if (btn) btn.onclick = saveProduct;
}
async function saveProduct() {
  const e = sheet.edit;
  const body = {
    category_id: Number($('#eCat').value),
    condition: $('#eCond').value,
    model_group: $('#eGroup').value.trim(),
    name: $('#eName').value.trim(),
    description: $('#eDesc').value.trim(),
    price: Number($('#ePrice').value.replace(/\s/g, '').replace(',', '.')),
    is_active: $('#eActive').checked ? 1 : 0,
    image_url: $('#eImg').value.trim() || null,
  };
  if (!body.model_group || !body.name || !body.price) {
    sheet.edit = { ...e, ...body };
    sheet.errors = { form: "Model, nomi va narxini to'ldiring" };
    haptic('error');
    renderSheet();
    return;
  }
  try {
    const saved = e.id
      ? await api(`/api/admin/products/${e.id}`, { method: 'PATCH', body })
      : await api('/api/admin/products', { method: 'POST', body });
    const list = state.admin.products || [];
    state.admin.products = e.id ? list.map(p => p.id === saved.id ? saved : p) : [...list, saved];
    haptic('success');
    toast(e.id ? 'Saqlandi' : "Qo'shildi");
    closeSheet();
    reloadProducts();
    render();
  } catch (err) { haptic('error'); toast(err.message); }
}

async function reloadProducts() {
  try { state.products = await api('/api/products'); } catch (e) {}
}

// ---------- Ishga tushirish ----------

async function init() {
  render();
  try {
    const [terms, cats, products] = await Promise.all([
      api('/api/installment-terms'), api('/api/categories'), api('/api/products'),
    ]);
    state.terms = terms; state.categories = cats; state.products = products;
  } catch (e) {
    $('#app').innerHTML = `<div class="page">${errorView(e.message)}</div>`;
    bind();
    return;
  }
  render();
  if (inTelegram || SAME_ORIGIN) {
    // Ikkinchi darajali ma'lumotlar — bosh sahifani kutib turmaydi
    api('/api/me').then(me => { state.me = me; if (me.is_admin) loadAdminApps(); else render(); }).catch(() => {});
    api('/api/applications').then(a => { state.applications = a; render(); }).catch(() => {});
  }
  api('/api/branches').then(b => { state.branches = b; }).catch(() => {});
}
init();
</script>
