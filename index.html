<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fursat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #FBF7F1);
    --text: var(--tg-theme-text-color, #241C15);
    --hint: var(--tg-theme-hint-color, #8A7E70);
    --accent: #1F6E5C;
    --accent-dark: #16503F;
    --card: var(--tg-theme-secondary-bg-color, #FFFFFF);
    --line: #E7DDCF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    padding-bottom: 40px;
  }
  h1, h2, h3, .price { font-family: 'Fraunces', serif; }

  header { padding: 20px 16px 12px; }
  header h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
  header .tag { color: var(--hint); font-size: 13px; margin-top: 2px; }
  .screen-title { padding: 18px 16px 4px; font-size: 20px; font-weight: 600; }

  /* Bosh menyu */
  .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 8px 16px 16px; }
  .menu-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px 14px;
    text-align: center;
    cursor: pointer;
  }
  .menu-card .icon { font-size: 30px; margin-bottom: 10px; }
  .menu-card .label { font-size: 14px; font-weight: 500; }

  /* Tanlov ro'yxati (holat / brend) */
  .choice-list { padding: 8px 16px; display: flex; flex-direction: column; gap: 10px; }
  .choice-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .choice-card .arrow { color: var(--hint); }

  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 16px 16px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid var(--line);
    font-size: 14px;
    color: var(--text);
    background: transparent;
    cursor: pointer;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px; }
  .product {
    background: var(--card);
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .product img { width: 100%; height: 130px; object-fit: cover; display: block; }
  .product .info { padding: 12px 10px 14px; }
  .product .name { font-size: 14px; font-weight: 500; line-height: 1.3; margin: 0 0 6px; min-height: 36px; }
  .product .price { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .product .from {
    font-size: 12px; color: var(--accent); background: rgba(31,110,92,0.1);
    display: inline-block; padding: 3px 8px; border-radius: 4px;
  }

  .empty { text-align: center; color: var(--hint); padding: 60px 20px; font-size: 14px; }

  /* Mahsulot detail (pastki panel) */
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: flex-end; z-index: 50; }
  .sheet.open { display: flex; }
  .sheet-panel { background: var(--bg); width: 100%; max-height: 88vh; border-radius: 16px 16px 0 0; padding: 18px 16px 28px; overflow-y: auto; }
  .sheet-panel img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 14px; }
  .sheet-panel h2 { margin: 0 0 4px; font-size: 20px; }
  .sheet-panel .desc { color: var(--hint); font-size: 13px; margin: 0 0 10px; }
  .sheet-panel .cash-price { font-size: 15px; margin: 0 0 16px; }
  .sheet-panel .cash-price b { font-family: 'Fraunces', serif; font-size: 19px; }

  .terms-label { font-size: 13px; color: var(--hint); margin-bottom: 8px; }
  .terms { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
  .term-btn {
    padding: 10px 4px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 13px; text-align: center; cursor: pointer;
  }
  .term-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .plan-summary { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 16px; }
  .plan-summary .monthly { font-size: 22px; font-weight: 600; font-family: 'Fraunces', serif; }
  .plan-summary .sub { font-size: 12px; color: var(--hint); margin-top: 4px; }

  .apply-form { display: none; flex-direction: column; gap: 10px; margin-top: 4px; }
  .apply-form.open { display: flex; }
  .apply-form input {
    padding: 12px 13px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 15px; font-family: inherit;
  }

  /* To'lovlarim */
  .payment-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin: 0 16px 10px; }
  .payment-card .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .payment-card .pname { font-weight: 500; font-size: 14px; }
  .payment-card .pstatus { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: rgba(31,110,92,0.12); color: var(--accent); }
  .payment-card .prow { font-size: 13px; color: var(--hint); }

  /* Call markaz / Filiallar */
  .info-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin: 0 16px 10px; }
  .info-card .iname { font-weight: 500; font-size: 15px; margin-bottom: 4px; }
  .info-card .iaddr { font-size: 13px; color: var(--hint); margin-bottom: 8px; }
  .info-card a.iphone { color: var(--accent); font-size: 14px; text-decoration: none; font-weight: 500; }
</style>
</head>
<body>

<header id="topHeader">
  <h1>Fursat</h1>
  <div class="tag">telefonlarni bo'lib to'lab sotib oling</div>
</header>

<div id="screenTitle"></div>
<div id="app"></div>

<div class="sheet" id="sheet">
  <div class="sheet-panel" id="sheetPanel"></div>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const API_BASE = 'https://bozorcha-backend-production.up.railway.app';

// ---------- Holat (navigatsiya) ----------
let stack = ['home'];              // ekranlar tarixi (orqaga qaytish uchun)
let selectedCondition = null;      // 'new' | 'used'
let selectedCategory = null;       // brend id
let categories = [];
let terms = [];
let products = [];
let applications = [];
let callCenter = [];
let branches = [];

let currentProduct = null;
let selectedTerm = null;
let applyMode = false;

function authHeaders() {
  return tg?.initData ? { 'Authorization': 'tma ' + tg.initData } : {};
}
function money(v) { return v.toLocaleString('uz-UZ') + " so'm"; }
function calcPlan(basePrice, months) {
  const term = terms.find(t => t.months === months);
  if (!term) return null;
  const total = Math.round(basePrice * (1 + term.markup));
  const monthly = Math.round(total / term.months);
  return { months, total, monthly };
}

function go(screen) {
  stack.push(screen);
  render();
}
function goBack() {
  if (stack.length > 1) stack.pop();
  render();
}
tg?.BackButton.onClick(goBack);

// ---------- Ekranlarni chizish ----------

function render() {
  const screen = stack[stack.length - 1];
  document.getElementById('topHeader').style.display = screen === 'home' ? 'block' : 'none';
  if (tg) { screen === 'home' ? tg.BackButton.hide() : tg.BackButton.show(); }

  const titleEl = document.getElementById('screenTitle');
  const titles = {
    condition: 'Sotuvdagi telefonlar', brand: 'Brendni tanlang', models: 'Modelni tanlang',
    payments: "To'lovlarim", callcenter: 'Call markaz', branches: 'Mavjud filiallar',
  };
  titleEl.innerHTML = titles[screen] ? `<div class="screen-title">${titles[screen]}</div>` : '';

  const app = document.getElementById('app');
  if (screen === 'home') app.innerHTML = homeHTML();
  else if (screen === 'condition') app.innerHTML = conditionHTML();
  else if (screen === 'brand') app.innerHTML = brandHTML();
  else if (screen === 'models') app.innerHTML = modelsHTML();
  else if (screen === 'payments') renderPayments();
  else if (screen === 'callcenter') renderCallCenter();
  else if (screen === 'branches') renderBranches();

  attachHandlers(screen);
}

function homeHTML() {
  return `
    <div class="menu-grid">
      <div class="menu-card" data-go="condition"><div class="icon">📱</div><div class="label">Sotuvdagi<br>telefonlar</div></div>
      <div class="menu-card" data-go="payments"><div class="icon">💳</div><div class="label">To'lovlarim</div></div>
      <div class="menu-card" data-go="callcenter"><div class="icon">☎️</div><div class="label">Call markaz</div></div>
      <div class="menu-card" data-go="branches"><div class="icon">🏢</div><div class="label">Mavjud<br>filiallar</div></div>
    </div>
  `;
}

function conditionHTML() {
  return `
    <div class="choice-list">
      <div class="choice-card" data-condition="new">Yangi telefonlar <span class="arrow">›</span></div>
      <div class="choice-card" data-condition="used">Ishlatilgan (B/U) yaxshi holatdagi telefonlar <span class="arrow">›</span></div>
    </div>
  `;
}

function brandHTML() {
  if (categories.length === 0) return `<div class="empty">Yuklanmoqda...</div>`;
  return `
    <div class="choice-list">
      ${categories.map(c => `<div class="choice-card" data-brand="${c.id}">${c.name} <span class="arrow">›</span></div>`).join('')}
    </div>
  `;
}

function modelsHTML() {
  if (products.length === 0) return `<div class="empty">Bu bo'limda mahsulot yo'q</div>`;
  const longestTerm = terms.length ? Math.max(...terms.map(t => t.months)) : null;
  return `
    <div class="grid">
      ${products.map(p => {
        const fromPlan = longestTerm ? calcPlan(p.price, longestTerm) : null;
        return `
        <div class="product" data-product="${p.id}">
          <img src="${p.image_url}" alt="${p.name}" loading="lazy">
          <div class="info">
            <p class="name">${p.name}</p>
            <p class="price">${money(p.price)}</p>
            ${fromPlan ? `<span class="from">${fromPlan.months} oyga: ${money(fromPlan.monthly)}/oy dan</span>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}

async function renderPayments() {
  const app = document.getElementById('app');
  app.innerHTML = `<div class="empty">Yuklanmoqda...</div>`;
  if (applications.length === 0) {
    const res = await fetch(`${API_BASE}/api/applications`, { headers: authHeaders() });
    applications = res.ok ? await res.json() : [];
  }
  if (applications.length === 0) {
    app.innerHTML = `<div class="empty">Hali arizangiz yo'q</div>`;
    return;
  }
  const statusLabels = { new: 'Yangi', contacted: 'Bog\'lanildi', approved: 'Tasdiqlandi', rejected: 'Rad etildi' };
  app.innerHTML = applications.map(a => `
    <div class="payment-card">
      <div class="top">
        <span class="pname">${a.product_name}</span>
        <span class="pstatus">${statusLabels[a.status] || a.status}</span>
      </div>
      <div class="prow">${a.term_months} oyga · ${money(a.monthly_payment)}/oy · jami ${money(a.total_price)}</div>
    </div>
  `).join('');
}

async function renderCallCenter() {
  const app = document.getElementById('app');
  app.innerHTML = `<div class="empty">Yuklanmoqda...</div>`;
  if (callCenter.length === 0) {
    const res = await fetch(`${API_BASE}/api/call-center`);
    callCenter = await res.json();
  }
  app.innerHTML = callCenter.map(c => `
    <div class="info-card">
      <div class="iname">${c.label}</div>
      <a class="iphone" href="tel:${c.phone}">${c.phone}</a>
    </div>
  `).join('');
}

async function renderBranches() {
  const app = document.getElementById('app');
  app.innerHTML = `<div class="empty">Yuklanmoqda...</div>`;
  if (branches.length === 0) {
    const res = await fetch(`${API_BASE}/api/branches`);
    branches = await res.json();
  }
  app.innerHTML = branches.map(b => `
    <div class="info-card">
      <div class="iname">${b.name}</div>
      <div class="iaddr">${b.address}</div>
      <a class="iphone" href="tel:${b.phone}">${b.phone}</a>
    </div>
  `).join('');
}

function attachHandlers(screen) {
  document.querySelectorAll('[data-go]').forEach(el => {
    el.onclick = () => go(el.dataset.go);
  });
  document.querySelectorAll('[data-condition]').forEach(el => {
    el.onclick = () => {
      selectedCondition = el.dataset.condition;
      go('brand');
    };
  });
  document.querySelectorAll('[data-brand]').forEach(el => {
    el.onclick = async () => {
      selectedCategory = el.dataset.brand;
      await loadProducts();
      go('models');
    };
  });
  document.querySelectorAll('[data-product]').forEach(el => {
    el.onclick = () => openProduct(Number(el.dataset.product));
  });
}

// ---------- Ma'lumot yuklash ----------

async function loadTerms() {
  const res = await fetch(`${API_BASE}/api/installment-terms`);
  terms = await res.json();
}
async function loadCategories() {
  const res = await fetch(`${API_BASE}/api/categories`);
  categories = await res.json();
}
async function loadProducts() {
  const url = `${API_BASE}/api/products?category_id=${selectedCategory}&condition=${selectedCondition}`;
  const res = await fetch(url);
  products = await res.json();
}

// ---------- Mahsulot detail (pastki panel) ----------

function openProduct(id) {
  currentProduct = products.find(p => p.id === id);
  selectedTerm = null;
  applyMode = false;
  renderSheet();
  document.getElementById('sheet').classList.add('open');
}

function renderSheet() {
  const p = currentProduct;
  const panel = document.getElementById('sheetPanel');
  const plan = selectedTerm ? calcPlan(p.price, selectedTerm) : null;

  panel.innerHTML = `
    <img src="${p.image_url}" alt="${p.name}">
    <h2>${p.name}</h2>
    <p class="desc">${p.description || ''}</p>
    <p class="cash-price">Naqd narxi: <b>${money(p.price)}</b></p>

    <p class="terms-label">Muddatni tanlang:</p>
    <div class="terms" id="termsRow">
      ${terms.map(t => `<div class="term-btn ${selectedTerm === t.months ? 'active' : ''}" data-months="${t.months}">${t.months} oy</div>`).join('')}
    </div>

    ${plan ? `
      <div class="plan-summary">
        <div class="monthly">${money(plan.monthly)}<span style="font-size:13px;font-weight:400;color:var(--hint)"> / oy</span></div>
        <div class="sub">${plan.months} oyga jami: ${money(plan.total)}</div>
      </div>
    ` : ''}

    <div class="apply-form ${applyMode ? 'open' : ''}" id="applyForm">
      <input type="text" id="custName" placeholder="Ismingiz">
      <input type="tel" id="custPhone" placeholder="Telefon raqamingiz">
    </div>
  `;

  panel.querySelectorAll('.term-btn').forEach(btn => {
    btn.onclick = () => {
      selectedTerm = Number(btn.dataset.months);
      renderSheet();
      updateMainButton();
    };
  });

  updateMainButton();
}

function updateMainButton() {
  if (!tg) return;
  const sheetOpen = document.getElementById('sheet').classList.contains('open');
  if (!sheetOpen || !selectedTerm) { tg.MainButton.hide(); return; }
  const plan = calcPlan(currentProduct.price, selectedTerm);
  tg.MainButton.setText(!applyMode ? `Ariza qoldirish · ${money(plan.monthly)}/oy` : 'Arizani yuborish');
  tg.MainButton.show();
}

tg?.MainButton.onClick(async () => {
  if (!currentProduct || !selectedTerm) return;

  if (!applyMode) {
    applyMode = true;
    renderSheet();
    return;
  }

  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  if (!name || !phone) {
    tg.HapticFeedback?.notificationOccurred('error');
    tg.showAlert('Iltimos, ismingiz va telefon raqamingizni kiriting');
    return;
  }

  const res = await fetch(`${API_BASE}/api/applications`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({
      product_id: currentProduct.id,
      term_months: selectedTerm,
      customer_name: name,
      customer_phone: phone,
    }),
  });

  if (res.ok) {
    tg.HapticFeedback?.notificationOccurred('success');
    applications = []; // keyingi safar "To'lovlarim" qayta yuklansin
    tg.showAlert("Arizangiz qabul qilindi! Tez orada operatorimiz siz bilan bog'lanadi.", () => {
      document.getElementById('sheet').classList.remove('open');
      tg.MainButton.hide();
    });
  } else {
    tg.showAlert('Xatolik yuz berdi, qayta urinib ko\'ring');
  }
});

document.getElementById('sheet').onclick = (e) => {
  if (e.target.id === 'sheet') {
    document.getElementById('sheet').classList.remove('open');
    tg?.MainButton.hide();
  }
};

// ---------- Ishga tushirish ----------

async function init() {
  await Promise.all([loadTerms(), loadCategories()]);
  render();
}
init();
</script>
</body>
</html>
