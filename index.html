<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fursat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #FBF7F1);
    --text: var(--tg-theme-text-color, #241C15);
    --hint: var(--tg-theme-hint-color, #8A7E70);
    --accent: #1F6E5C;
    --accent-dark: #16503F;
    --card: var(--tg-theme-secondary-bg-color, #FFFFFF);
    --line: #E7DDCF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    padding-bottom: 40px;
  }
  h1, h2, h3, .price { font-family: 'Fraunces', serif; }

  header {
    padding: 20px 16px 12px;
  }
  header h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
  header .tag { color: var(--hint); font-size: 13px; margin-top: 2px; }

  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 16px 16px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid var(--line);
    font-size: 14px;
    color: var(--text);
    background: transparent;
    cursor: pointer;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 16px;
  }
  .product {
    background: var(--card);
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .product img { width: 100%; height: 130px; object-fit: cover; display: block; }
  .product .info { padding: 12px 10px 14px; }
  .product .name { font-size: 14px; font-weight: 500; line-height: 1.3; margin: 0 0 6px; min-height: 36px; }
  .product .price { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .product .from {
    font-size: 12px;
    color: var(--accent);
    background: rgba(31,110,92,0.1);
    display: inline-block;
    padding: 3px 8px;
    border-radius: 4px;
  }

  .empty { text-align: center; color: var(--hint); padding: 60px 20px; font-size: 14px; }

  /* Mahsulot detail (pastki panel) */
  .sheet {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: flex-end;
    z-index: 50;
  }
  .sheet.open { display: flex; }
  .sheet-panel {
    background: var(--bg);
    width: 100%;
    max-height: 88vh;
    border-radius: 16px 16px 0 0;
    padding: 18px 16px 28px;
    overflow-y: auto;
  }
  .sheet-panel img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 14px; }
  .sheet-panel h2 { margin: 0 0 4px; font-size: 20px; }
  .sheet-panel .desc { color: var(--hint); font-size: 13px; margin: 0 0 10px; }
  .sheet-panel .cash-price { font-size: 15px; margin: 0 0 16px; }
  .sheet-panel .cash-price b { font-family: 'Fraunces', serif; font-size: 19px; }

  .terms-label { font-size: 13px; color: var(--hint); margin-bottom: 8px; }
  .terms {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .term-btn {
    padding: 10px 4px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    font-size: 13px;
    text-align: center;
    cursor: pointer;
  }
  .term-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .plan-summary {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .plan-summary .monthly { font-size: 22px; font-weight: 600; font-family: 'Fraunces', serif; }
  .plan-summary .sub { font-size: 12px; color: var(--hint); margin-top: 4px; }

  .apply-form { display: none; flex-direction: column; gap: 10px; margin-top: 4px; }
  .apply-form.open { display: flex; }
  .apply-form input {
    padding: 12px 13px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
</style>
</head>
<body>

<header>
  <h1>Fursat</h1>
  <div class="tag">telefonlarni bo'lib to'lab sotib oling</div>
</header>

<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">Bu bo'limda mahsulot yo'q</div>

<div class="sheet" id="sheet">
  <div class="sheet-panel" id="sheetPanel"></div>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

// Backend manzili
const API_BASE = 'https://bozorcha-backend-production.up.railway.app';

let products = [];
let categories = [];
let terms = [];
let activeCategory = null;
let currentProduct = null;
let selectedTerm = null;
let applyMode = false;

function authHeaders() {
  return tg?.initData ? { 'Authorization': 'tma ' + tg.initData } : {};
}

function money(v) {
  return v.toLocaleString('uz-UZ') + " so'm";
}

// Oylik to'lovni hisoblash (backenddagi config.js bilan bir xil formula)
function calcPlan(basePrice, months) {
  const term = terms.find(t => t.months === months);
  if (!term) return null;
  const total = Math.round(basePrice * (1 + term.markup));
  const monthly = Math.round(total / term.months);
  return { months, total, monthly };
}

async function loadTerms() {
  const res = await fetch(`${API_BASE}/api/installment-terms`);
  terms = await res.json();
}

async function loadCategories() {
  const res = await fetch(`${API_BASE}/api/categories`);
  categories = await res.json();
  const chips = document.getElementById('chips');
  chips.innerHTML = '<button class="chip active" data-id="">Barchasi</button>' +
    categories.map(c => `<button class="chip" data-id="${c.id}">${c.name}</button>`).join('');
  chips.querySelectorAll('.chip').forEach(btn => {
    btn.onclick = () => {
      chips.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = btn.dataset.id || null;
      loadProducts();
    };
  });
}

async function loadProducts() {
  const url = activeCategory ? `${API_BASE}/api/products?category_id=${activeCategory}` : `${API_BASE}/api/products`;
  const res = await fetch(url);
  products = await res.json();
  renderProducts();
}

function renderProducts() {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  if (products.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  const longestTerm = terms.length ? Math.max(...terms.map(t => t.months)) : null;
  grid.innerHTML = products.map(p => {
    const fromPlan = longestTerm ? calcPlan(p.price, longestTerm) : null;
    return `
    <div class="product" onclick="openProduct(${p.id})">
      <img src="${p.image_url}" alt="${p.name}" loading="lazy">
      <div class="info">
        <p class="name">${p.name}</p>
        <p class="price">${money(p.price)}</p>
        ${fromPlan ? `<span class="from">${fromPlan.months} oyga: ${money(fromPlan.monthly)}/oy dan</span>` : ''}
      </div>
    </div>
  `;
  }).join('');
}

function openProduct(id) {
  currentProduct = products.find(p => p.id === id);
  selectedTerm = null;
  applyMode = false;
  renderSheet();
  document.getElementById('sheet').classList.add('open');
}

function renderSheet() {
  const p = currentProduct;
  const panel = document.getElementById('sheetPanel');
  const plan = selectedTerm ? calcPlan(p.price, selectedTerm) : null;

  panel.innerHTML = `
    <img src="${p.image_url}" alt="${p.name}">
    <h2>${p.name}</h2>
    <p class="desc">${p.description || ''}</p>
    <p class="cash-price">Naqd narxi: <b>${money(p.price)}</b></p>

    <p class="terms-label">Muddatni tanlang:</p>
    <div class="terms" id="termsRow">
      ${terms.map(t => `<div class="term-btn ${selectedTerm === t.months ? 'active' : ''}" data-months="${t.months}">${t.months} oy</div>`).join('')}
    </div>

    ${plan ? `
      <div class="plan-summary">
        <div class="monthly">${money(plan.monthly)}<span style="font-size:13px;font-weight:400;color:var(--hint)"> / oy</span></div>
        <div class="sub">${plan.months} oyga jami: ${money(plan.total)}</div>
      </div>
    ` : ''}

    <div class="apply-form ${applyMode ? 'open' : ''}" id="applyForm">
      <input type="text" id="custName" placeholder="Ismingiz">
      <input type="tel" id="custPhone" placeholder="Telefon raqamingiz">
    </div>
  `;

  panel.querySelectorAll('.term-btn').forEach(btn => {
    btn.onclick = () => {
      selectedTerm = Number(btn.dataset.months);
      renderSheet();
      updateMainButton();
    };
  });

  updateMainButton();
}

function updateMainButton() {
  if (!tg) return;
  if (!selectedTerm) { tg.MainButton.hide(); return; }
  const plan = calcPlan(currentProduct.price, selectedTerm);
  if (!applyMode) {
    tg.MainButton.setText(`Ariza qoldirish · ${money(plan.monthly)}/oy`);
  } else {
    tg.MainButton.setText('Arizani yuborish');
  }
  tg.MainButton.show();
}

tg?.MainButton.onClick(async () => {
  if (!currentProduct || !selectedTerm) return;

  if (!applyMode) {
    applyMode = true;
    renderSheet();
    return;
  }

  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  if (!name || !phone) {
    tg.HapticFeedback?.notificationOccurred('error');
    tg.showAlert('Iltimos, ismingiz va telefon raqamingizni kiriting');
    return;
  }

  const res = await fetch(`${API_BASE}/api/applications`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({
      product_id: currentProduct.id,
      term_months: selectedTerm,
      customer_name: name,
      customer_phone: phone,
    }),
  });

  if (res.ok) {
    tg.HapticFeedback?.notificationOccurred('success');
    tg.showAlert("Arizangiz qabul qilindi! Tez orada operatorimiz siz bilan bog'lanadi.", () => {
      document.getElementById('sheet').classList.remove('open');
      tg.MainButton.hide();
    });
  } else {
    tg.showAlert('Xatolik yuz berdi, qayta urinib ko\'ring');
  }
});

document.getElementById('sheet').onclick = (e) => {
  if (e.target.id === 'sheet') {
    document.getElementById('sheet').classList.remove('open');
    tg?.MainButton.hide();
  }
};

async function init() {
  await loadTerms();
  await loadCategories();
  await loadProducts();
}
init();
</script>
</body>
</html>
